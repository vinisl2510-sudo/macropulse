services:
  db:
    image: postgres:16
    container_name: macropulse-db
    environment:
      POSTGRES_DB: macropulse
      POSTGRES_USER: macropulse
      POSTGRES_PASSWORD: macropulse
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macropulse -d macropulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./back/macropulse
    container_name: macropulse-api
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://db:5432/macropulse
      DB_USER: macropulse
      DB_PASSWORD: macropulse
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: