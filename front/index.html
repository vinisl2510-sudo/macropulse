<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Indicadores macroeconômicos do Brasil com dados do Banco Central: Selic, dólar, euro, IPCA, juro real e simulador de investimentos."
    />
    <title>MacroPulse</title>
    <!--
      Aplica o tema ANTES de a página aparecer. Sem isto, quem usa o tema escuro
      veria a tela piscar em claro enquanto o React carrega.
    -->
    <script>
      (function () {
        var tema = null;
        try {
          tema = localStorage.getItem('macropulse-tema');
        } catch (e) {
          // localStorage pode estar bloqueado: segue o sistema
        }
        if (tema !== 'claro' && tema !== 'escuro') {
          tema = matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
        }
        document.documentElement.dataset.tema = tema;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
