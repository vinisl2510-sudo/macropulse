server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compacta as respostas de texto para o site carregar mais rápido
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # DNS interno do Docker. Com ele, o Nginx descobre o endereço da API a cada
    # 30 segundos, e continua funcionando se o container da API for recriado.
    resolver 127.0.0.11 valid=30s;

    # Proxy reverso: estes caminhos não são do site, e sim da API Java.
    # Cobre /api, /swagger-ui, /swagger-ui.html e /v3/api-docs.
    location ~ ^/(api|swagger-ui|v3/api-docs) {
        # "api" é o nome do serviço no docker-compose.yml
        set $api http://api:8081;
        proxy_pass $api;

        # O padrão é esperar 60 segundos. Com a API fora do ar, o site ficaria esse
        # tempo todo em "Carregando..." antes de mostrar a mensagem de erro.
        proxy_connect_timeout 5s;

        # Host com a porta: a API monta os endereços do Swagger a partir dele
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback do SPA: um endereço como /simulador não é um arquivo. Nesse caso,
    # entrega o index.html, e o React Router decide o que mostrar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
